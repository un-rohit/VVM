<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 500" width="1850" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#025b5b"/>
      <stop offset="100%" stop-color="#013333"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F7CB1F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left: Crest / Emblem (Centered around x=260, y=250) -->
  <g id="emblem" filter="url(#subtleShadow)">
    <!-- Outer Shield -->
    <path d="M 120 70 
             Q 260 45 400 70 
             Q 410 240 400 310 
             Q 370 410 260 460 
             Q 150 410 120 310 
             Q 110 240 120 70 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Inset Border -->
    <path d="M 138 90 
             Q 260 68 382 90 
             Q 390 235 382 298 
             Q 355 388 260 435 
             Q 165 388 138 298 
             Q 130 235 138 90 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="3" 
          stroke-dasharray="8 4" 
          opacity="0.85"/>

    <!-- Rising Sun Rays in Shield Upper Half -->
    <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="260" y1="190" x2="260" y2="120" />
      <line x1="260" y1="190" x2="225" y2="130" />
      <line x1="260" y1="190" x2="295" y2="130" />
      <line x1="260" y1="190" x2="195" y2="148" />
      <line x1="260" y1="190" x2="325" y2="148" />
      <line x1="260" y1="190" x2="175" y2="175" />
      <line x1="260" y1="190" x2="345" y2="175" />
    </g>

    <!-- Rising Sun Semi-Circle -->
    <path d="M 210 195 A 50 50 0 0 1 310 195 Z" fill="url(#goldGrad)" />

    <!-- Open Book of Knowledge (Vidya) -->
    <!-- Left Page -->
    <path d="M 260 280 
             C 230 260, 185 260, 160 270 
             L 160 330 
             C 185 320, 230 320, 260 340 Z" 
          fill="#FFFFFF" 
          stroke="url(#goldGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>
    <!-- Page text lines left -->
    <line x1="178" y1="285" x2="242" y2="280" stroke="#014E4E" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="178" y1="298" x2="242" y2="293" stroke="#014E4E" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="178" y1="311" x2="235" y2="306" stroke="#014E4E" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Page -->
    <path d="M 260 280 
             C 290 260, 335 260, 360 270 
             L 360 330 
             C 335 320, 290 320, 260 340 Z" 
          fill="#F8FAFC" 
          stroke="url(#goldGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>
    <!-- Page text lines right -->
    <line x1="278" y1="280" x2="342" y2="285" stroke="#014E4E" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="278" y1="293" x2="342" y2="298" stroke="#014E4E" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="285" y1="306" x2="342" y2="311" stroke="#014E4E" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Book Spine Ribbon -->
    <path d="M 257 280 L 263 280 L 263 355 L 260 350 L 257 355 Z" fill="#D97706" />

    <!-- Sacred Lamp of Wisdom (Diya / Flame) centered above the book -->
    <!-- Diya Base -->
    <path d="M 238 245 C 238 253, 282 253, 282 245 C 275 240, 245 240, 238 245 Z" fill="url(#goldGrad)"/>
    <ellipse cx="260" cy="242" rx="18" ry="4" fill="#FFE066"/>
    <!-- Flame -->
    <path d="M 260 205 C 267 220, 274 227, 268 238 C 265 242, 255 242, 252 238 C 246 227, 253 220, 260 205 Z" fill="url(#flameGrad)"/>
    <!-- Inner Flame Core -->
    <path d="M 260 216 C 263 224, 267 229, 264 235 C 262 237, 258 237, 256 235 C 253 229, 257 224, 260 216 Z" fill="#FFFDF0"/>

    <!-- Three Stars of Excellence in Arch -->
    <g fill="url(#goldGrad)">
      <!-- Left Star -->
      <polygon points="210,85 213,94 222,94 215,99 217,108 210,103 203,108 205,99 198,94 207,94" transform="rotate(-15 210 96)"/>
      <!-- Center Star (Largest) -->
      <polygon points="260,68 264,79 276,79 266,86 270,97 260,91 250,97 254,86 244,79 256,79" transform="scale(1.15) translate(-34 -12)"/>
      <!-- Right Star -->
      <polygon points="310,85 313,94 322,94 315,99 317,108 310,103 303,108 305,99 298,94 307,94" transform="rotate(15 310 96)"/>
    </g>

    <!-- Bottom Ribbon Scroll: "ESTD 1988" -->
    <g>
      <path d="M 160 395 
               Q 260 415 360 395 
               L 375 425 
               Q 260 445 145 425 Z" 
            fill="url(#goldGrad)" 
            stroke="#92400E" 
            stroke-width="2"/>
      <!-- Ribbon Ends Fold -->
      <path d="M 145 425 L 160 395 L 140 390 Z" fill="#B45309"/>
      <path d="M 375 425 L 360 395 L 380 390 Z" fill="#B45309"/>
      <text x="260" y="420" 
            font-family="'Inter', 'Montserrat', 'Arial', sans-serif" 
            font-size="20" 
            font-weight="900" 
            letter-spacing="5" 
            fill="#013333" 
            text-anchor="middle">ESTD. 1988</text>
    </g>
  </g>

  <!-- Right: School Brand Name & Identity (x: 480 to 1800) -->
  <g transform="translate(480, 0)">
    <!-- Primary Heading: VANI VIDYA MANDIR -->
    <text x="0" y="200" 
          font-family="'Cinzel', 'Playfair Display', 'Merriweather', 'Georgia', serif" 
          font-size="94" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#014E4E">VANI VIDYA MANDIR</text>

    <!-- Subheading: HIGH SCHOOL • GAMHARIA -->
    <text x="5" y="280" 
          font-family="'Outfit', 'Inter', system-ui, sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="9" 
          fill="#D97706">HIGH SCHOOL • GAMHARIA</text>

    <!-- Decorative Gold Accent Rule -->
    <g transform="translate(5, 310)">
      <line x1="0" y1="0" x2="1050" y2="0" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Centered diamond & stars -->
      <polygon points="525,-7 532,0 525,7 518,0" fill="#014E4E"/>
      <circle cx="505" cy="0" r="3.5" fill="#D97706"/>
      <circle cx="545" cy="0" r="3.5" fill="#D97706"/>
    </g>

    <!-- Motto / Tagline -->
    <text x="5" y="365" 
          font-family="'Outfit', 'Inter', system-ui, sans-serif" 
          font-size="27" 
          font-weight="700" 
          letter-spacing="7" 
          fill="#475569">KNOWLEDGE • DISCIPLINE • EXCELLENCE</text>

    <!-- Location & Govt Recognition Pill / Sub-badge -->
    <g transform="translate(5, 400)">
      <rect x="0" y="0" width="620" height="34" rx="17" fill="#014E4E" opacity="0.08"/>
      <text x="18" y="23" 
            font-family="'Outfit', 'Inter', system-ui, sans-serif" 
            font-size="17" 
            font-weight="700" 
            letter-spacing="2.5" 
            fill="#014E4E">WARD 7, CHOTA GAMHARIA • JAMSHEDPUR, JHARKHAND</text>
    </g>
  </g>
</svg>
